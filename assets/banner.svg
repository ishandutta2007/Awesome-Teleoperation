<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glow Behind Title -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <style>
      .radar-sweep {
        transform-origin: 1050px 180px;
        animation: radarRotate 8s linear infinite;
      }
      .pulse-circle {
        transform-origin: 1050px 180px;
        animation: pulseRing 3s ease-out infinite;
      }
      .pulse-circle-2 {
        transform-origin: 1050px 180px;
        animation: pulseRing 3s ease-out infinite 1.5s;
      }
      .data-packet {
        stroke-dasharray: 8, 12;
        animation: dataFlow 4s linear infinite;
      }
      .data-packet-rev {
        stroke-dasharray: 6, 14;
        animation: dataFlowRev 5s linear infinite;
      }
      .beacon-glow {
        animation: blink 2s ease-in-out infinite alternate;
      }

      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 20px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 130px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes dataFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dataFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 80; }
      }
      @keyframes blink {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Soft Ambient Glow behind Center/Right -->
  <circle cx="600" cy="180" r="320" fill="url(#centerGlow)" />
  <circle cx="1050" cy="180" r="150" fill="url(#centerGlow)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Non-obtrusive, low opacity, background layer) -->
  <g opacity="0.45">
    <!-- Teleoperation Radar / Node Center on Right -->
    <circle cx="1050" cy="180" r="40" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.4" />
    <circle cx="1050" cy="180" r="80" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,6" opacity="0.3" />
    <circle cx="1050" cy="180" r="120" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.25" />

    <!-- Expanding Radar Pulse Rings -->
    <circle class="pulse-circle" cx="1050" cy="180" r="20" fill="none" stroke="#38bdf8" />
    <circle class="pulse-circle-2" cx="1050" cy="180" r="20" fill="none" stroke="#818cf8" />

    <!-- Radar Sweep Line -->
    <g class="radar-sweep">
      <line x1="1050" y1="180" x2="1190" y2="180" stroke="url(#glowCyan)" stroke-width="2" />
      <polygon points="1050,180 1190,140 1190,180" fill="#00f2fe" opacity="0.08" />
    </g>

    <!-- Radar Center Blip -->
    <circle cx="1050" cy="180" r="5" fill="#38bdf8" />
    <circle class="beacon-glow" cx="1050" cy="180" r="9" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Dynamic Low-Latency Network Stream Lines -->
    <path class="data-packet" d="M 50 70 L 450 70 Q 520 70 550 110 L 620 200 Q 650 240 720 240 L 1050 180" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <path class="data-packet-rev" d="M 50 310 L 350 310 Q 420 310 460 270 L 540 180 Q 580 140 650 140 L 980 140 Q 1020 140 1050 180" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5" />
    
    <!-- Remote Nodes / Waypoints -->
    <circle cx="450" cy="70" r="3.5" fill="#38bdf8" />
    <circle cx="620" cy="200" r="3.5" fill="#818cf8" />
    <circle cx="460" cy="270" r="3.5" fill="#a855f7" />
    <circle cx="720" cy="240" r="3.5" fill="#38bdf8" />
  </g>

  <!-- High-Tech Frame Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 20 50 L 20 20 L 50 20" />
    <path d="M 1180 50 L 1180 20 L 1150 20" />
    <path d="M 20 310 L 20 340 L 50 340" />
    <path d="M 1180 310 L 1180 340 L 1150 340" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, crisp visibility, unaffected by background animations -->
  <g id="foreground" transform="translate(80, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="410" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#10b981" />
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ROBOT CONTROL  •  WEBRTC  •  FLEET TELEOPERATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Awesome <tspan fill="url(#primaryGrad)">Teleoperation</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      A Curated Guide to SaaS Platforms, Open-Source Stacks &amp; Remote Robot Supervision
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 235)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📡 Low-Latency WebRTC</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Humanoid &amp; ALOHA</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(384, 0)">
        <rect width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚗 Vehicle Assistance</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(571, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ ROS 2 Stacks</text>
      </g>
    </g>

    <!-- Footer Meta -->
    <text x="2" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Curated by <tspan fill="#38bdf8">ishandutta2007</tspan> • Community Driven &amp; Actively Maintained
    </text>
  </g>
</svg>
